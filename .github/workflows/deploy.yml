name: 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 사이트 베이스 경로 결정
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.event.repository.full_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$OWNER.github.io" = "$REPO_FULL" ]; then
            echo "SITE_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE_URL=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi

      - name: 데이터 기반 사이트 빌드
        run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4