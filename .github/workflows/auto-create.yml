name: 자동 창작 (두시오분)

on:
  schedule:
    # 하루 6개의 창작 슬롯 (KST 기준 대략: 09:47 / 13:23 / 16:31 / 20:05 / 23:52 / 04:38)
    # 30분마다 발화해 create.py가 '지금 시각이 오늘 계획의 슬롯 시간 창 안인지'를 판정한다.
    # (긴 주기 크론은 GH Actions가 수시간씩 밀려 발화할 수 있어, 짧은 주기로 바꿔도 놓치지 않게 함)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 봇 커밋 후 배포 워크플로우를 gh workflow run으로 직접 트리거하기 위해 필요

concurrency:
  group: auto-create
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 실행 원인 설정
        shell: bash
        run: |
          echo "RUN_REASON=${{ github.event_name }}" >> "$GITHUB_ENV"
          echo "실행 원인: ${{ github.event_name }}"

      - name: 자동 창작 실행
        env:
          # 보안: API 키는 반드시 Repository Secrets(GEMINI_API_KEY)로만 주입합니다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python agent/create.py

      - name: 변경 사항 커밋 및 푸시
        env:
          # 봇 커밋은 GITHUB_TOKEN으로 푸시하기 때문에 push 이벤트가
          # 다른 워크플로우(deploy)를 자동 발동시키지 않는다.
          # 그래서 커밋이 생기면 배포 워크플로우를 여기서 직접 트리거한다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "두시오분[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ agent/state.json
          if ! git diff --cached --quiet; then
            git commit -m "자동 창작: $(date +%F)"
            git push
            gh workflow run "배포 (GitHub Pages)" --ref main
          else
            echo "새 창작물이 없어 커밋하지 않습니다."
          fi