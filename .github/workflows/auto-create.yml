name: 자동 창작 (두시오분)

on:
  repository_dispatch:
    types: [auto_create]   # cron-job.org에서 발동 (가장 신뢰할 수 있는 실행 경로)
  schedule:
    - cron: "*/30 * * * *"   # GitHub 스케줄 (지연될 수 있음 — 보조)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 봇 커밋 후 배포 워크플로우를 gh workflow run으로 직접 트리거하기 위해 필요

concurrency:
  group: auto-create
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 실행 원인 설정
        shell: bash
        run: |
          echo "RUN_REASON=${{ github.event_name }}" >> "$GITHUB_ENV"
          echo "실행 원인: ${{ github.event_name }}"

      - name: 자동 창작 실행
        env:
          # 보안: API 키는 반드시 Repository Secrets로만 주입합니다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          POLLIN_API_KEY: ${{ secrets.POLLIN_API_KEY }}
          POLLIN_MODELS: ${{ vars.POLLIN_MODELS }}
          PIXAI_API_KEY: ${{ secrets.PIXAI_API_KEY }}
          PIXAI_MODEL_VERSION: ${{ vars.PIXAI_MODEL_VERSION }}
          PIXAI_MODE: ${{ vars.PIXAI_MODE }}
          PIXAI_STYLE: ${{ vars.PIXAI_STYLE }}
        run: python agent/create.py

      - name: 변경 사항 커밋 및 푸시
        env:
          # 봇 커밋은 GITHUB_TOKEN으로 푸시하기 때문에 push 이벤트가
          # 다른 워크플로우(deploy)를 자동 발동시키지 않는다.
          # 그래서 커밋이 생기면 배포 워크플로우를 여기서 직접 트리거한다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "두시오분[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ agent/
          if ! git diff --cached --quiet; then
            git commit -m "자동 창작: $(date +%F)"
            git push
            gh workflow run "배포 (GitHub Pages)" --ref main
          else
            echo "새 창작물이 없어 커밋하지 않습니다."
          fi